name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Laravel API — Pint (lint) + Pest (tests) on in-memory SQLite
  # ---------------------------------------------------------------------------
  api:
    name: API (Laravel 11 · PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, openssl, curl, zip, bcmath, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: composer lint:test

      - name: Tests (Pest)
        run: composer test

  # ---------------------------------------------------------------------------
  # Next.js web — typecheck + build + Playwright e2e
  # ---------------------------------------------------------------------------
  web:
    name: Web (Next.js 15 · Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build web
        run: npm run build --workspace @browsejobs/web

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # The admin e2e specs need the real API on :8000 with the local seed.
      - name: Setup PHP 8.3 (for the e2e API)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, openssl, curl, zip, bcmath, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Boot seeded API on :8000
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$PWD/database/database.sqlite"
            echo "QUEUE_CONNECTION=sync"
            echo "CACHE_STORE=file"
            echo "APP_ENV=local"
          } >> .env
          php artisan migrate --seed --force
          php artisan serve --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up && break; sleep 1; done

      - name: E2E (Playwright)
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
