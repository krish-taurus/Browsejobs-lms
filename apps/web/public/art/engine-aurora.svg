<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Engine aurora — flowing streams of interview signal being woven into structure.
       Brand palette only: ink navy void, trust-blue and deep-navy light. -->
  <defs>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B6DF0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#1B6DF0" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#7FB3F7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1B6DF0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E3FA9" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#0E3FA9" stop-opacity="0.65"/>
      <stop offset="0.8" stop-color="#1B6DF0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0E3FA9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FB3F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FB3F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FB3F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowDeep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E3FA9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E3FA9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTrust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B6DF0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1B6DF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- Ambient pools of light -->
  <ellipse cx="1290" cy="700" rx="620" ry="420" fill="url(#glowDeep)"/>
  <ellipse cx="1050" cy="240" rx="480" ry="300" fill="url(#glowTrust)" opacity="0.7"/>
  <ellipse cx="240" cy="820" rx="420" ry="260" fill="url(#glowDeep)" opacity="0.5"/>

  <!-- Flowing ribbons -->
  <g filter="url(#softer)">
    <path d="M -60 620 C 340 480, 620 720, 980 560 S 1520 380, 1700 460"
          fill="none" stroke="url(#ribbonB)" stroke-width="120" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)">
    <path d="M -60 560 C 320 430, 660 640, 1010 500 S 1500 330, 1680 400"
          fill="none" stroke="url(#ribbonA)" stroke-width="34" stroke-linecap="round"/>
    <path d="M -60 680 C 380 560, 700 780, 1080 630 S 1540 470, 1700 540"
          fill="none" stroke="url(#ribbonA)" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
    <path d="M -60 500 C 300 390, 640 560, 1000 440 S 1480 280, 1680 340"
          fill="none" stroke="url(#ribbonC)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Fine signal threads (sharp, above the blur) -->
  <path d="M -60 585 C 330 455, 650 665, 1005 525 S 1505 355, 1690 425"
        fill="none" stroke="#7FB3F7" stroke-width="1.4" opacity="0.5"/>
  <path d="M -60 645 C 360 525, 690 745, 1060 600 S 1530 440, 1700 505"
        fill="none" stroke="#1B6DF0" stroke-width="1" opacity="0.4"/>

  <!-- Particle field -->
  <g fill="#7FB3F7">
    <circle cx="220" cy="500" r="2.2" opacity="0.6"/>
    <circle cx="410" cy="586" r="1.6" opacity="0.5"/>
    <circle cx="560" cy="470" r="2.6" opacity="0.7"/>
    <circle cx="760" cy="640" r="1.8" opacity="0.45"/>
    <circle cx="905" cy="520" r="2.2" opacity="0.65"/>
    <circle cx="1085" cy="435" r="1.5" opacity="0.5"/>
    <circle cx="1230" cy="565" r="2.8" opacity="0.6"/>
    <circle cx="1370" cy="420" r="1.8" opacity="0.5"/>
    <circle cx="1470" cy="520" r="2.2" opacity="0.55"/>
    <circle cx="330" cy="700" r="1.5" opacity="0.4"/>
    <circle cx="1140" cy="700" r="1.8" opacity="0.45"/>
  </g>

  <!-- Structure forming on the right: the syllabus grid assembling -->
  <g stroke="#1B6DF0" fill="none" opacity="0.55">
    <rect x="1330" y="48" width="100" height="48" rx="10" stroke-opacity="0.45" fill="#1B6DF0" fill-opacity="0.08"/>
    <rect x="1444" y="48" width="100" height="48" rx="10" stroke-opacity="0.3" fill="#1B6DF0" fill-opacity="0.05"/>
    <rect x="1330" y="110" width="100" height="48" rx="10" stroke-opacity="0.25" fill="#1B6DF0" fill-opacity="0.04"/>
  </g>
</svg>
