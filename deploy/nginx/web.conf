# BrowseJobs LMS web app (Next.js) — browsejobs.ai + www → next start on :3000.
# TLS added by certbot. Host canonicalisation (www → apex, .in → .ai) is handled
# in the app's next.config redirects (P4.10); keep both hosts pointed here so
# those 301s can fire.

server {
    listen 80;
    server_name browsejobs.ai www.browsejobs.ai;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long-cache Next's immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
