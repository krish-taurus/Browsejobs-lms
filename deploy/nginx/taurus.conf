# Taurus AI (apps/taurus) at browsejobs.ai/taurusai.
#
# Included inside the browsejobs.ai server block(s) as
# /etc/nginx/snippets/browsejobs-taurus.conf — deploy.sh installs it and adds
# the `include` line to the live site config (which certbot has edited, so the
# site file itself is never overwritten).
#
# Taurus runs its own Next.js server on :3100, built with basePath /taurusai.
# The older BrowseJobs Taurus client portal keeps a few pages on the LMS web
# app (:3000); those exact paths are routed there first. Longest prefix wins
# in nginx, so these beat `^~ /taurusai` regardless of order.

location = /taurusai/app            { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /taurusai/app/          { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /taurusai/claim/        { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location = /taurusai/portal-login   { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location = /taurusai/recruitment    { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location = /taurusai/hiring-demo    { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

# Taurus's own immutable build assets.
location ^~ /taurusai/_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Everything else under /taurusai: the Taurus app.
location ^~ /taurusai {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI Employee chats and workflow runs wait on a model; knowledge uploads are documents.
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}
