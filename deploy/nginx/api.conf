# BrowseJobs LMS API (Laravel) — api.browsejobs.ai → PHP-FPM.
# TLS is added by certbot (`certbot --nginx -d api.browsejobs.ai`).

server {
    listen 80;
    server_name api.browsejobs.ai;
    root /var/www/browsejobs/apps/api/public;
    index index.php;

    # Uploads: recordings/transcripts/CSV imports. Tune to your largest upload.
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Never serve dotfiles / VCS.
    location ~ /\.(?!well-known).* { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
